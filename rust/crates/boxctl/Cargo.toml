[package]
name = "boxctl"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Box Rust control daemon and CLI"
license = "GPL-3.0-only"

[[bin]]
name = "boxctl"
path = "src/main.rs"

[dependencies]
libc = "0.2"
lzma-rs = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
base64 = "0.23"
ureq = "3.5"
url = "2"
